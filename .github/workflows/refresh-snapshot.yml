# Scheduled cache refresh - base PRD FR2.
#
# FR2: "Cache refresh runs on a schedule (e.g., every 15-30 min) or manually
# before a demo; a timestamped fallback snapshot is always committed to the
# repo so the app works with zero live network dependency during judging."
#
# Why a GitHub Actions cron and not a Vercel cron: the requirement is that the
# refreshed snapshot ends up COMMITTED. A Vercel cron runs on a read-only
# filesystem and cannot write to the repo, so it could only refresh an
# ephemeral in-memory copy - which would satisfy the word "schedule" and miss
# the point of the requirement. This workflow refreshes the data and commits
# it; the committed snapshot stays the source of truth, exactly as the
# architecture assumes.
#
# SETUP: add FORTYGUARD_API_KEY as a repository secret. Without it the workflow
# still runs and regenerates everything it can (relief network, routes), and
# the heat field stays a modelled stand-in - which the app then banners.
#
# OPTIONAL, to push the refresh all the way to the live site: add VERCEL_TOKEN,
# VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets. Until then the
# deploy step skips itself and the deployment serves whatever snapshot was
# current when it was last deployed by hand. A commit alone does NOT redeploy:
# that would need the GitHub repo linked to the Vercel project, which requires
# a login connection on the Vercel account and cannot be done from the CLI.

name: Refresh data snapshot

on:
  schedule:
    # Every 30 minutes during Arizona daylight hours (13:00-04:00 UTC covers
    # roughly 06:00-21:00 MST). Overnight refreshes would spend credits on a
    # field nobody is working in.
    - cron: '*/30 13-23,0-4 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region id to refresh, or blank for all'
        required: false
        default: ''
      force:
        description: 'Re-request even cached (area, time) pairs'
        type: boolean
        required: false
        default: false

concurrency:
  # A slow ingest must never overlap the next scheduled run and double-spend
  # credits on the same tiles.
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build region argument
        id: args
        run: |
          if [ -n "${{ inputs.region }}" ]; then
            echo "region=-- --region=${{ inputs.region }}" >> "$GITHUB_OUTPUT"
          else
            echo "region=" >> "$GITHUB_OUTPUT"
          fi

      # Relief networks change through the season as sites open and close, so
      # this is refreshed alongside the heat field rather than pinned.
      - name: Refresh relief network
        run: npm run data:stations ${{ steps.args.outputs.region }}
        continue-on-error: true

      # Re-resolved with ORS when the key is present, so every region uses the
      # same router rather than whichever one was available the day it was first
      # generated. Falls back to keyless OSRM, and never fails the run.
      - name: Refresh work routes
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: npm run data:routes ${{ steps.args.outputs.region }}
        continue-on-error: true

      - name: Refresh heat field
        env:
          FORTYGUARD_API_KEY: ${{ secrets.FORTYGUARD_API_KEY }}
        run: |
          npm run data:ingest ${{ steps.args.outputs.region }} ${{ inputs.force && '-- --force' || '' }}

      # Only meaningful with a key; the script exits non-zero without one,
      # which must not fail the whole refresh.
      - name: Refresh hourly environmental profiles
        env:
          FORTYGUARD_API_KEY: ${{ secrets.FORTYGUARD_API_KEY }}
        run: npm run data:hourly ${{ steps.args.outputs.region }}
        continue-on-error: true

      - name: Verify the snapshot still loads
        run: |
          npm run typecheck
          # verify:data exits non-zero on any FAIL - a snapshot that has gone
          # stale, lost a grid, or drifted out of internal consistency must not
          # be committed and deployed on top of a working one.
          npm run verify:data
          npm run verify:coverage

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "coolroute-bot"
          git config user.email "coolroute-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No snapshot changes - nothing to commit."
            exit 0
          fi
          # Report what this run actually did. `liveApiUsed` only says the cached
          # grids came from FortyGuard at some point, so using it alone let this
          # message announce a refresh on runs that fetched nothing at all.
          SUMMARY=$(node -e "
            const m = require('./data/phoenix/cache/manifest.json');
            const fetched = m.fetchedThisRun ?? 0;
            const date = m.snapshotDate ?? m.grids[0]?.validAt?.slice(0,10) ?? 'unknown';
            console.log(fetched > 0
              ? 'heat field ' + date + ' (' + fetched + ' grids fetched)'
              : 'relief network only (heat field ' + date + ' already cached)');
          ")
          git commit -m "data: $SUMMARY"
          git push

      # Inert until the three secrets exist. Deploying from the working tree
      # rather than from a git trigger is deliberate: the project has no GitHub
      # connection, and this way the deploy carries exactly the snapshot this
      # run just verified rather than whatever the default branch holds by the
      # time a webhook fires.
      # The guard is shell, not a step `if`, and that is the whole point. A
      # step-level `if` cannot see a token: it is evaluated before the step's
      # own `env:` block is applied, and `secrets` is not addressable there.
      # The obvious workaround - hoisting the secrets to job-level `env` - was
      # worse than the bug, because it would hand VERCEL_TOKEN to every step in
      # the job, including `npm ci` and the three data scripts, all of which
      # execute third-party package code. Testing for it in the shell keeps the
      # credential in this step alone and makes the skip unambiguous.
      # Only deploy when the heat field actually moved. With a rolling snapshot
      # date that is once a day; the other ~29 runs in daylight hours are relief
      # -site churn, and redeploying for each would burn Vercel's daily
      # deployment allowance to ship a file nobody can see the difference in.
      - name: Decide whether a deploy is warranted
        id: deploy_gate
        run: |
          FETCHED=$(node -e "const m=require('./data/phoenix/cache/manifest.json');console.log(m.fetchedThisRun ?? 0)")
          echo "fetched=$FETCHED" >> "$GITHUB_OUTPUT"
          if [ "$FETCHED" -gt 0 ]; then
            echo "Heat field changed ($FETCHED grids) - deploy warranted."
          else
            echo "No grids fetched this run - skipping deploy."
          fi

      - name: Deploy the refreshed snapshot
        if: steps.deploy_gate.outputs.fetched != '0'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set - skipping the deploy."
            echo "The refreshed snapshot is committed; the live site keeps whatever"
            echo "it was last deployed with. Add VERCEL_TOKEN, VERCEL_ORG_ID and"
            echo "VERCEL_PROJECT_ID as repository secrets to close the loop."
            exit 0
          fi
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        # A failed deploy must not fail a refresh that already committed good data.
        continue-on-error: true
